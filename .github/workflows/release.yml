name: Verified ARM64 release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      mode:
        description: Validate current source or refresh an existing release without rebuilding
        type: choice
        options: [validation, refresh]
        default: validation
      tag:
        description: Existing release tag, required for refresh
        type: string
        default: ''

# Publication and refresh never cancel each other. Obsolete test validation can stop.
concurrency:
  group: ${{ inputs.mode == 'validation' && format('release-validation-{0}', github.ref) || 'verified-release' }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'validation' }}

permissions:
  contents: read
  actions: read

env:
  CI: '1'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.groups.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - id: groups
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs'
          import { verificationGroups } from './scripts/verification-checks.mjs'
          appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ group: Object.keys(verificationGroups) })}\n`)
          JS

  verify:
    name: Verify (${{ matrix.group }})
    needs: plan
    # The browser fixtures require H.264 decoding on x64 Linux.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/verify
        with:
          group: ${{ matrix.group }}

  verification:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      evidence-id: ${{ steps.evidence.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: checks-${{ github.run_id }}-*
          merge-multiple: true
          path: .data/verification
      - name: Verify job provenance and combine results
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/collect-verification.mjs
      - name: Transfer completed verification
        id: evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: .data/release/checks.json
          retention-days: 7
          if-no-files-found: error

  release:
    needs: verification
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    env:
      RELEASE_MODE: ${{ github.ref_type == 'tag' && github.event_name == 'push' && 'publish' || inputs.mode || 'validation' }}
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - name: Check out selected source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Set up image builder
        if: env.RELEASE_MODE != 'refresh'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Cache ARM64 build layers
        if: env.RELEASE_MODE != 'refresh'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/release-build-cache
          key: release-linux-arm64-v1-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            release-linux-arm64-v1-${{ github.sha }}-
            release-linux-arm64-v1-
      - name: Read source verification
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.verification.outputs.evidence-id }}
          merge-multiple: true
          path: .data/release
      - name: Authenticate image publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
      - name: Build, test, and publish ARM64 images
        env:
          RELEASE_BUILD_CACHE: ${{ runner.temp }}/release-build-cache
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-ci.mjs
      - name: Save verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .data/release/*.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Log out of the registry
        if: always()
        run: docker logout ghcr.io
