services:
  viewer:
    build:
      context: .
      args:
        MEDIAMTX_HLS_URL: http://host.docker.internal:8888
        MEDIAMTX_WEBRTC_URL: http://host.docker.internal:8889
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      AUTH_DB_PATH: /data/auth.sqlite
      AUTH_BACKUP_DIR: /data/backups
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-development-only-secret-change-before-production}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      INTERNAL_AUTH_SECRET: ${INTERNAL_AUTH_SECRET:-development-only-secret-change-before-production}
      MEDIAMTX_AUTH_SECRET: ${MEDIAMTX_AUTH_SECRET:-development-only-secret-change-before-production}
      MEDIAMTX_API_URL: http://host.docker.internal:9997
      THUMBNAIL_DIR: /thumbnails
    volumes:
      - auth_data:/data
      - thumbnail_data:/thumbnails:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - feedboard

  thumbnailer:
    build:
      context: .
      dockerfile: deploy/oracle/thumbnailer.Dockerfile
    restart: unless-stopped
    environment:
      MEDIAMTX_API_URL: http://host.docker.internal:9997
      MEDIAMTX_RTSP_URL: rtsp://host.docker.internal:8554
      THUMBNAIL_DIR: /thumbnails
      THUMBNAIL_INITIAL_DELAY_SECONDS: 5
      THUMBNAIL_INTERVAL_SECONDS: 180
    volumes:
      - thumbnail_data:/thumbnails
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - feedboard

networks:
  feedboard:
    external: true
    name: feedboard_feedboard-net

volumes:
  auth_data:
  thumbnail_data:
