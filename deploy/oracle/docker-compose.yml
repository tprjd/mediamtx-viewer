name: mediamtx-viewer

services:
  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    env_file:
      - ./secrets/caddy.env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      mediamtx:
        condition: service_started
      mediamtx-health:
        condition: service_healthy
      viewer:
        condition: service_healthy
    networks:
      - viewer_net
    logging:
      options:
        max-size: 10m
        max-file: "3"

  centrifugo:
    image: centrifugo/centrifugo:v6.9.3@sha256:017d0a3d39757f94a09efa657b6ad7e68222564dd9ba7dd7193981d75cd8a025
    restart: unless-stopped
    environment:
      CENTRIFUGO_CHANNEL_NAMESPACES: >-
        [{"name":"chat","history_size":300,"history_ttl":"30s","force_recovery":true,"force_positioning":true,"allow_subscribe_for_client":false,"allow_publish_for_client":false,"allow_publish_for_subscriber":false},{"name":"control","allow_subscribe_for_client":false,"allow_publish_for_client":false,"allow_publish_for_subscriber":false}]
      CENTRIFUGO_CLIENT_ALLOWED_ORIGINS: https://${PUBLIC_HOSTNAME:?Set PUBLIC_HOSTNAME in caddy.env}
      CENTRIFUGO_CLIENT_DISALLOW_ANONYMOUS_CONNECTION_TOKENS: "true"
      CENTRIFUGO_CLIENT_TOKEN_AUDIENCE: frankerzspam-chat
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_TOKEN_HMAC_SECRET:?Set CENTRIFUGO_TOKEN_HMAC_SECRET in caddy.env}
      CENTRIFUGO_CLIENT_TOKEN_ISSUER: frankerzspam-viewer
      CENTRIFUGO_ENGINE_TYPE: memory
      CENTRIFUGO_HEALTH_ENABLED: "true"
      CENTRIFUGO_HTTP_API_KEY: ${CENTRIFUGO_API_KEY:?Set CENTRIFUGO_API_KEY in caddy.env}
      CENTRIFUGO_LOG_LEVEL: warn
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - viewer_net
    logging:
      options:
        max-size: 10m
        max-file: "3"

  mediamtx:
    image: bluenviron/mediamtx:1.20.1
    restart: unless-stopped
    environment:
      MTX_AUTHMETHOD: http
      MTX_AUTHHTTPADDRESS: http://viewer:3000/api/internal/mediamtx/authorize?secret=${MEDIAMTX_AUTH_SECRET:?Set MEDIAMTX_AUTH_SECRET in caddy.env}
    ports:
      - "1935:1935/tcp"
      - "1936:1936/tcp"
      - "8189:8189/udp"
      - "8189:8189/tcp"
    volumes:
      - ./secrets/mediamtx.yml:/mediamtx.yml:ro
    networks:
      - viewer_net
    logging:
      options:
        max-size: 10m
        max-file: "3"

  mediamtx-health:
    image: alpine:3.22.1
    restart: unless-stopped
    command: ["sh", "-c", "exec tail -f /dev/null"]
    depends_on:
      mediamtx:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -qO- http://mediamtx:9997/v3/paths/list >/dev/null &&
          wget -qO- http://mediamtx:9998/metrics >/dev/null &&
          nc -z -w 2 mediamtx 8554 &&
          nc -z -w 2 mediamtx 1935 &&
          nc -z -w 2 mediamtx 8888 &&
          nc -z -w 2 mediamtx 8889 &&
          nc -z -w 2 mediamtx 8189
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - viewer_net
    logging:
      options:
        max-size: 10m
        max-file: "3"

  thumbnailer:
    build:
      context: ../..
      dockerfile: deploy/oracle/thumbnailer.Dockerfile
    restart: unless-stopped
    environment:
      MEDIAMTX_API_URL: http://mediamtx:9997
      MEDIAMTX_HLS_URL: http://mediamtx:8888
      THUMBNAIL_DIR: /thumbnails
      THUMBNAIL_INITIAL_DELAY_SECONDS: 5
      THUMBNAIL_INTERVAL_SECONDS: 180
    volumes:
      - thumbnail_data:/thumbnails
    depends_on:
      mediamtx-health:
        condition: service_healthy
      viewer:
        condition: service_healthy
    networks:
      - viewer_net
    logging:
      options:
        max-size: 10m
        max-file: "3"

  discord-notifier:
    image: node:24-alpine
    restart: unless-stopped
    env_file:
      - ./secrets/caddy.env
      - ./secrets/discord.env
    environment:
      VIEWER_URL: http://viewer:3000
      STATE_FILE: /state/discord-notifier-state.json
      STABLE_MS: "30000"
      COOLDOWN_MS: "900000"
    volumes:
      - ../../scripts/discord-notifier.mjs:/app/discord-notifier.mjs:ro
      - ../../scripts/chat-alerts.mjs:/app/chat-alerts.mjs:ro
      - discord_notifier_state:/state
    depends_on:
      viewer:
        condition: service_healthy
    networks:
      - viewer_net
    command: ["node", "/app/discord-notifier.mjs"]
    logging:
      options:
        max-size: 10m
        max-file: "3"

  viewer:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SOURCE_FINGERPRINT: ${SOURCE_FINGERPRINT:-unverified}
        MEDIAMTX_HLS_URL: http://mediamtx:8888
        MEDIAMTX_WEBRTC_URL: http://mediamtx:8889
    restart: unless-stopped
    env_file:
      - ./secrets/oci-usage.env
    environment:
      AUTH_DB_PATH: /data/auth.sqlite
      AUTH_BACKUP_DIR: /data/backups
      CHAT_DB_PATH: /data/chat.sqlite
      CHAT_DATABASE_LIMIT_BYTES: ${CHAT_DATABASE_LIMIT_BYTES:-2147483648}
      CHAT_MINIMUM_FREE_BYTES: ${CHAT_MINIMUM_FREE_BYTES:-10737418240}
      CHAT_ENABLED: ${CHAT_ENABLED:-false}
      CHAT_TAG_HMAC_SECRET: ${CHAT_TAG_HMAC_SECRET:-}
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY:?Set CENTRIFUGO_API_KEY in caddy.env}
      CENTRIFUGO_API_URL: http://centrifugo:8000/api
      CENTRIFUGO_TOKEN_HMAC_SECRET: ${CENTRIFUGO_TOKEN_HMAC_SECRET:?Set CENTRIFUGO_TOKEN_HMAC_SECRET in caddy.env}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in caddy.env}
      BETTER_AUTH_URL: https://${PUBLIC_HOSTNAME:?Set PUBLIC_HOSTNAME in caddy.env}
      INTERNAL_AUTH_SECRET: ${INTERNAL_AUTH_SECRET:?Set INTERNAL_AUTH_SECRET in caddy.env}
      MEDIAMTX_AUTH_SECRET: ${MEDIAMTX_AUTH_SECRET:?Set MEDIAMTX_AUTH_SECRET in caddy.env}
      MEDIAMTX_API_URL: http://mediamtx:9997
      OCI_STATS_ENABLED: "true"
      OCI_FREE_A1_OCPU_HOURS: ${OCI_FREE_A1_OCPU_HOURS:-3000}
      OCI_FREE_A1_MEMORY_GB_HOURS: ${OCI_FREE_A1_MEMORY_GB_HOURS:-18000}
      OCI_FREE_BLOCK_STORAGE_GB: ${OCI_FREE_BLOCK_STORAGE_GB:-200}
      OCI_FREE_OUTBOUND_GB: ${OCI_FREE_OUTBOUND_GB:-10000}
      THUMBNAIL_DIR: /thumbnails
    volumes:
      - auth_data:/data
      - thumbnail_data:/thumbnails:ro
      - ./secrets/oci-usage-api-key.pem:/run/secrets/oci-usage-api-key.pem:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - viewer_net
    logging:
      options:
        max-size: 10m
        max-file: "3"

networks:
  viewer_net:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  caddy_data:
  caddy_config:
  auth_data:
  thumbnail_data:
  discord_notifier_state:
